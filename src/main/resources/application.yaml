spring:
  config:
    import:
      - config.yaml
  exposed:
    generate-ddl: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 5
      max-lifetime: 90000
sentry:
  dsn: ${SENTRY_DSN}
